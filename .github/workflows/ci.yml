name: SenkoJE Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify repository rules (No em-dash or en-dash)
        shell: bash
        run: |
          if grep -rnE $'\xe2\x80\x93|\xe2\x80\x94' docs/ README.md CODING_RULES.md src/ 2>/dev/null; then
            echo "Error: Em-dash or en-dash detected. Replace with standard ASCII hyphen (-)."
            exit 1
          fi

      - name: Run Maven build and tests (when pom.xml exists)
        shell: bash
        run: |
          if [ -f "pom.xml" ]; then
            mvn -B clean verify -Pjlink
          else
            echo "No pom.xml found yet. Skipping Maven build step."
          fi

      - name: Verify jlink trimmed runtime modules
        shell: bash
        run: |
          if [ -d "target/senkoje-runtime/bin" ]; then
            target/senkoje-runtime/bin/java --list-modules | grep -q "javafx.controls"
            target/senkoje-runtime/bin/java --list-modules | grep -q "javafx.fxml"
            target/senkoje-runtime/bin/java --list-modules | grep -q "javafx.media"
            target/senkoje-runtime/bin/java --list-modules | grep -q "java.sql"
          else
            echo "Error: jlink trimmed runtime was not generated."
            exit 1
          fi
